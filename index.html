<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bestimer</title>
<meta name="description" content="ミニマルで直感的なタイマー・ストップウォッチ・ポモドーロ・時計">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='12' fill='none' stroke='%23ea580c' stroke-width='3'/%3E%3Cpath d='M16 10v7l4 3' stroke='%23ea580c' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa; --fg:#171717; --sub:#737373; --dim:#d4d4d4; --line:#e5e5e5; --soft:#efefef; --soft2:#e3e3e3; --raised:#fff;
  --accent:#ea580c; --accent-fg:#fff; --rest:#0d9488;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f0f; --fg:#f5f5f5; --sub:#8c8c8c; --dim:#454545; --line:#3d3d3d; --soft:#262626; --soft2:#333; --raised:#404040;
    --accent:#fb923c; --accent-fg:#171717; --rest:#2dd4bf; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f0f; --fg:#f5f5f5; --sub:#8c8c8c; --dim:#454545; --line:#3d3d3d; --soft:#262626; --soft2:#333; --raised:#404040;
  --accent:#fb923c; --accent-fg:#171717; --rest:#2dd4bf; color-scheme:dark;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg); color:var(--fg);
  font-family:Inter,system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent;
  display:flex; flex-direction:column; min-height:100dvh; overflow-x:hidden;
  transition:background .3s;
}
body.rest{--accent:var(--rest)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
header{display:flex;justify-content:center;align-items:center;padding:16px;position:relative}
.tabs{display:flex;gap:2px;background:var(--soft);padding:4px;border-radius:999px}
.tabs button{
  position:relative;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--sub);
  transition:color .2s,background .2s;white-space:nowrap;
}
.tabs button:hover{color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.08)}
.tabs button i{position:absolute;top:6px;right:8px;width:5px;height:5px;border-radius:50%;background:var(--fg);display:none}
.tabs button.live i{display:block}
.tools{position:absolute;right:16px;top:50%;transform:translateY(-50%);display:flex;gap:4px}
.icon{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.icon:hover,.icon.on{color:var(--fg);background:var(--soft)}
.pip-holder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--sub);font-size:15px}
.icon svg{width:18px;height:18px}

/* main */
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px 32px;gap:20px;min-height:0}
.sub{min-height:28px;display:flex;align-items:center;gap:6px;color:var(--sub);font-size:15px;flex-wrap:wrap;justify-content:center}
/* pomodoro phase picker: same segmented style as the top tabs, with a bigger hit area */
.seg{display:flex;gap:2px;background:var(--soft);padding:4px;border-radius:999px}
.chip{padding:8px 16px;border-radius:999px;font-size:14px;font-weight:500;color:var(--sub);white-space:nowrap;transition:color .2s,background .2s}
.chip:hover{color:var(--fg)}
.chip.on{background:var(--raised);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.08)}
.disp{
  font-family:Manrope,Inter,system-ui,sans-serif;
  font-weight:700;font-variant-numeric:tabular-nums;font-feature-settings:"tnum";
  font-size:clamp(64px,16vw,220px);line-height:1;letter-spacing:-.04em;
  user-select:none;white-space:nowrap;cursor:default;text-align:center;
}
.disp.click{touch-action:none}
.disp [data-u]{cursor:ns-resize}
.disp [data-u].on{color:var(--accent)}
.disp small{font-size:.38em;letter-spacing:0;color:var(--sub);font-weight:500}
.disp .dim{color:var(--dim)}
.disp u{text-decoration:none;font-size:.28em;color:var(--sub);font-weight:500;margin:0 .25em 0 .06em;letter-spacing:0}
.disp .caret{display:inline-block;width:.04em;height:.8em;background:var(--accent);vertical-align:-.04em;animation:blink 1s steps(1) infinite;margin-left:.04em}
@keyframes blink{50%{opacity:0}}
.ringing .disp{color:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.bar{width:min(560px,80vw);height:3px;background:var(--line);border-radius:3px;overflow:hidden;visibility:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:3px;width:0}
.bar.show{visibility:visible}

.ctrls{display:flex;gap:12px;align-items:center;justify-content:center;min-height:64px;flex-wrap:wrap}
/* every control button shares one size; secondary ones are a flat gray fill, no outline */
.btn{height:64px;min-width:136px;padding:0 24px;border-radius:999px;font-size:17px;font-weight:600;
  background:var(--soft);color:var(--fg);transition:transform .1s,background .2s,color .2s}
.btn:hover{background:var(--soft2)}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--accent);color:var(--accent-fg)}
.btn.main:hover{filter:brightness(1.06);background:var(--accent);color:var(--accent-fg)}
.btn.main.pause{background:var(--fg);color:var(--bg)}

.extra{min-height:48px;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.hint{font-size:13px;color:var(--sub)}

.laps{width:min(420px,100%);max-height:30vh;overflow:auto;font-variant-numeric:tabular-nums;font-size:15px}
.laps div{display:grid;grid-template-columns:3em 1fr 1fr;padding:9px 4px;border-top:1px solid var(--line)}
.laps div span:nth-child(1){color:var(--sub)}
.laps div span:nth-child(3){text-align:right;color:var(--sub)}
.laps .best{color:var(--rest)} .laps .worst{color:var(--accent)}

.dots{display:flex;gap:8px;align-items:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.f{background:var(--accent)}
.dots b{font-weight:400;font-size:13px;color:var(--sub);margin-left:6px}
.cfg{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;font-size:13px;color:var(--sub);align-items:center}
.cfg label{display:flex;align-items:center;gap:6px}
.cfg input[type=number]{width:56px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:inherit;font-size:14px;text-align:center}
.cfg input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.link{font-size:13px;color:var(--sub);padding:4px 8px;border-radius:6px}
.link:hover{color:var(--fg)}

#kb{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none;font-size:16px;border:0;padding:0}

/* voice assistant panel */
.voice{position:fixed;z-index:20;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);
  width:min(460px,calc(100vw - 32px));display:flex;align-items:center;gap:16px;padding:16px 20px;
  border-radius:28px;background:var(--soft);cursor:pointer}
.voice[hidden]{display:none}
.orb{position:relative;flex:none;width:32px;height:32px;border-radius:50%;background:var(--fg)}
.orb::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--fg);opacity:0}
.voice[data-state="listen"] .orb{animation:orb 1.6s ease-in-out infinite}
.voice[data-state="listen"] .orb::after{animation:halo 1.6s ease-out infinite}
.voice[data-state="reply"] .orb{transform:scale(.72)}
@keyframes orb{50%{transform:scale(.86)}}
@keyframes halo{0%{transform:scale(1);opacity:.22}100%{transform:scale(1.7);opacity:0}}
.vbody{min-width:0;flex:1}
#vtext{font-size:17px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
#vhint{font-size:13px;color:var(--sub);line-height:1.4;margin-top:2px;overflow-wrap:anywhere}
#vhint:empty{display:none}
@media (prefers-reduced-motion:reduce){.voice .orb,.voice .orb::after{animation:none!important}}

@media (max-width:820px){
  header{flex-direction:column;gap:8px}
  .tools{position:static;transform:none}
}
@media (max-width:520px){
  header{flex-direction:column;gap:8px;padding:12px 16px}
  .tools{position:static;transform:none}
  .tabs button,.chip{padding:8px 11px;font-size:13px}
  .tabs button i{right:4px}
  .btn{min-width:100px;padding:0 16px}
}
@media (max-height:520px) and (orientation:landscape){
  main{gap:10px;padding-top:4px}
  .disp{font-size:clamp(60px,26vh,200px)}
  .extra{display:none}
}
</style>
</head>
<body>
<header>
  <nav class="tabs" role="tablist" aria-label="モード">
    <button role="tab" data-mode="timer">タイマー<i></i></button>
    <button role="tab" data-mode="stopwatch">ストップウォッチ<i></i></button>
    <button role="tab" data-mode="pomodoro">ポモドーロ<i></i></button>
    <button role="tab" data-mode="clock">時計</button>
  </nav>
  <div class="tools">
    <button class="icon" id="mic" title="音声で操作 (V)" aria-label="音声で操作"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
    <button class="icon" id="theme" title="テーマ切替" aria-label="テーマ切替"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
    <button class="icon" id="pip" title="小窓で表示 (P)" aria-label="小窓で表示"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg></button>
    <button class="icon" id="fs" title="全画面 (F)" aria-label="全画面"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</header>

<main>
  <div class="sub" id="sub"></div>
  <div class="disp" id="disp" aria-live="off"></div>
  <div class="bar" id="bar"><span></span></div>
  <div class="ctrls" id="ctrls"></div>
  <div class="extra" id="extra"></div>
</main>
<input id="kb" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="時間を入力">
<div class="voice" id="voice" role="status" aria-live="polite" hidden>
  <div class="orb"></div>
  <div class="vbody"><p id="vtext"></p><p id="vhint"></p></div>
</div>


<script>
(() => {
const $ = s => document.querySelector(s);
const now = () => Date.now();
const pad = n => String(n).padStart(2, '0');
const MIN = 60000;
const MODES = ['timer', 'stopwatch', 'pomodoro', 'clock'];
const PHASE = { work: '集中', short: '休憩', long: '長い休憩' };

/* ---------- state ---------- */
const KEY = 'bestimer.v1';
const DEF = {
  mode: 'timer',
  timer: { dur: 5 * MIN, rem: 5 * MIN, total: 5 * MIN, end: null },
  sw: { start: null, acc: 0, laps: [] },
  pomo: { phase: 'work', done: 0, dur: 25 * MIN, rem: 25 * MIN, total: 25 * MIN, end: null,
          cfg: { work: 25, short: 5, long: 15, every: 4, auto: false } },
  clock: { h24: true },
  theme: null,
  voiceSeen: false,
};
let S = structuredClone(DEF);
try {
  const saved = JSON.parse(localStorage.getItem(KEY));
  if (saved) for (const k in DEF) if (saved[k] != null)
    S[k] = typeof DEF[k] === 'object' && DEF[k] ? { ...DEF[k], ...saved[k] } : saved[k];
  S.pomo.cfg = { ...DEF.pomo.cfg, ...S.pomo.cfg };
} catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} };

let edit = null;          // timer digit buffer while typing
let ringing = null;       // {src, msg}
let showCfg = false;

/* ---------- countdown helpers ---------- */
const CD = {
  run: o => o.end != null,
  left: o => o.end != null ? Math.max(0, o.end - now()) : o.rem,
  start(o) {
    if (o.end != null) return;
    if (o.rem <= 0) { o.rem = o.dur; o.total = o.dur; }
    if (o.rem <= 0) return;
    o.end = now() + o.rem;
  },
  pause(o) { if (o.end == null) return; o.rem = CD.left(o); o.end = null; },
  reset(o) { o.end = null; o.rem = o.dur; o.total = o.dur; },
  add(o, ms) {
    const l = CD.left(o);
    if (l + ms <= 0) ms = -l + 1000;
    if (o.end != null) o.end += ms; else o.rem += ms;
    o.total = Math.max(o.total + ms, CD.left(o));
  },
  set(o, ms) { o.dur = ms; CD.reset(o); },
};
const swEl = () => S.sw.acc + (S.sw.start != null ? now() - S.sw.start : 0);
const swRun = () => S.sw.start != null;

/* ---------- format ---------- */
function hms(ms, ceil) {
  const t = ceil ? Math.ceil(ms / 1000) : Math.floor(ms / 1000);
  const h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60), s = t % 60;
  return { h, text: h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}` };
}
const plain = ms => hms(ms, false).text + '.' + pad(Math.floor(ms % 1000 / 10));

/* ---------- sound / notify / wake ---------- */
let ac, ringIv, ringTo;
function audio() {
  try { ac ??= new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch {}
  return ac;
}
function chime() {
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [0, .16, .32].forEach((x, i) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'sine'; o.frequency.value = i === 2 ? 1319 : 988;
    g.gain.setValueAtTime(0, t + x);
    g.gain.linearRampToValueAtTime(.28, t + x + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + x + .25);
    o.connect(g).connect(a.destination); o.start(t + x); o.stop(t + x + .3);
  });
}
function askNotify() {
  audio();
  if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission().catch(() => {});
}
function ring(src, msg) {
  ringing = { src, msg };
  S.mode = src; edit = null;
  bodyCls('ringing', true);
  chime(); clearInterval(ringIv); clearTimeout(ringTo);
  ringIv = setInterval(chime, 1400);
  ringTo = setTimeout(() => clearInterval(ringIv), 60000);
  if (navigator.vibrate) navigator.vibrate([300, 150, 300, 150, 300]);
  if ('Notification' in window && Notification.permission === 'granted' && document.hidden) {
    try { new Notification('Bestimer', { body: msg, tag: 'bestimer' }); } catch {}
  }
  save(); ui();
}
function dismiss() {
  if (!ringing) return;
  clearInterval(ringIv); clearTimeout(ringTo);
  if (ringing.src === 'timer') CD.reset(S.timer);
  ringing = null;
  bodyCls('ringing', false);
  save(); ui();
}
let wl = null;
async function wake() {
  const need = !document.hidden && (CD.run(S.timer) || swRun() || CD.run(S.pomo) || S.mode === 'clock');
  try {
    if (need && !wl && navigator.wakeLock) { wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => wl = null); }
    else if (!need && wl) { wl.release(); wl = null; }
  } catch {}
}

/* ---------- actions ---------- */
const act = fn => (...a) => { fn(...a); save(); ui(); };

const timerStart = act(() => {
  if (edit != null) return commit();
  if (CD.left(S.timer) <= 0 && S.timer.dur <= 0) return startEdit();
  askNotify(); CD.start(S.timer);
});
const timerToggle = () => CD.run(S.timer) ? act(() => CD.pause(S.timer))() : timerStart();

function startEdit() {
  if (CD.run(S.timer) || ringing) return;
  edit = ''; kb.value = ''; kb.focus({ preventScroll: true }); ui();
}
function commit() {
  const d = (edit || '').padStart(6, '0');
  const ms = (+d.slice(0, 2) * 3600 + +d.slice(2, 4) * 60 + +d.slice(4)) * 1000;
  edit = null; kb.blur();
  if (ms > 0) { askNotify(); CD.set(S.timer, ms); CD.start(S.timer); }
  save(); ui();
}
function cancelEdit() { edit = null; kb.blur(); ui(); }
function typeDigit(k) {
  if (edit == null) { edit = ''; }
  if (edit === '' && k === '0') return ui();
  if (edit.length < 6) edit += k;
  kb.value = edit; ui();
}

const swToggle = act(() => {
  if (swRun()) { S.sw.acc = swEl(); S.sw.start = null; }
  else S.sw.start = now();
});
const swLap = act(() => { if (swRun()) S.sw.laps.push(swEl()); });
const swReset = act(() => { S.sw = { start: null, acc: 0, laps: [] }; });

function pomoPhase(p) {
  S.pomo.phase = p;
  CD.set(S.pomo, S.pomo.cfg[p] * MIN);
}
function pomoNext() {
  const P = S.pomo;
  if (P.phase === 'work') { P.done++; pomoPhase(P.done % P.cfg.every === 0 ? 'long' : 'short'); }
  else pomoPhase('work');
}
const pomoToggle = act(() => { if (CD.run(S.pomo)) CD.pause(S.pomo); else { askNotify(); CD.start(S.pomo); } });
const pomoSkip = act(() => { const auto = CD.run(S.pomo); pomoNext(); if (auto) CD.start(S.pomo); });

function primary() {
  if (S.mode === 'timer') timerToggle();
  else if (S.mode === 'stopwatch') swToggle();
  else if (S.mode === 'pomodoro') pomoToggle();
  else if (S.mode === 'clock') act(() => S.clock.h24 = !S.clock.h24)();
}
const reset = act(() => {
  if (S.mode === 'timer') {
    edit = null;
    // running/paused → back to the set time; already idle → clear to 00:00
    if (CD.run(S.timer) || CD.left(S.timer) !== S.timer.dur) CD.reset(S.timer); else CD.set(S.timer, 0);
  }
  else if (S.mode === 'stopwatch') S.sw = { start: null, acc: 0, laps: [] };
  else if (S.mode === 'pomodoro') CD.reset(S.pomo);
});
const setMode = act(m => { if (m !== 'timer') { edit = null; kb.blur(); } S.mode = m; showCfg = false; });

/* ---------- render ---------- */
const disp = $('#disp'), sub = $('#sub'), bar = $('#bar'), barIn = bar.firstElementChild,
      ctrls = $('#ctrls'), extra = $('#extra'), kb = $('#kb');
const tabsEl = $('.tabs'), pipBtn = $('#pip');
const appParts = [$('header'), $('main'), kb, $('#voice')];           // what moves into the PiP window
const pipHolder = Object.assign(document.createElement('div'), { className: 'pip-holder',
  innerHTML: '<p>小窓で表示中</p><button class="btn">ここに戻す</button>' });
pipHolder.querySelector('button').onclick = () => closePip();
// body classes (ringing / rest) must apply in whichever window shows the UI
function bodyCls(name, on) {
  document.body.classList.toggle(name, on);
  if (pipWin) pipWin.document.body.classList.toggle(name, on);
}

function btn(label, fn, cls = '', title = '') {
  const b = document.createElement('button');
  b.className = 'btn ' + cls; b.textContent = label; if (title) b.title = title;
  b.addEventListener('click', e => { e.preventDefault(); fn(); });
  return b;
}
function el(html) { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

function ui() {
  tabsEl.querySelectorAll('button').forEach(b => {
    const m = b.dataset.mode;
    b.setAttribute('aria-selected', m === S.mode);
    const live = (m === 'timer' && CD.run(S.timer)) || (m === 'stopwatch' && swRun()) || (m === 'pomodoro' && CD.run(S.pomo));
    b.classList.toggle('live', live && m !== S.mode);
  });
  bodyCls('rest', S.mode === 'pomodoro' && S.pomo.phase !== 'work');
  ctrls.replaceChildren(); extra.replaceChildren(); sub.replaceChildren();
  disp.classList.toggle('click', S.mode === 'timer' && !CD.run(S.timer));
  disp.title = S.mode === 'timer' && !CD.run(S.timer) ? 'クリックして時間を入力' : S.mode === 'clock' ? 'クリックで12/24時間切替' : '';

  if (ringing) {
    sub.textContent = ringing.msg;
    ctrls.append(btn('停止', dismiss, 'main'));
    return tick(true);
  }

  if (S.mode === 'timer') {
    const T = S.timer, run = CD.run(T), left = CD.left(T);
    if (edit != null) {
      sub.textContent = '数字で時間を入力';
      ctrls.append(btn('キャンセル', cancelEdit), btn('開始', commit, 'main'));
      extra.append(el('<div class="hint">例: 130 → 1分30秒 ／ 10000 → 1時間</div>'));
    } else {
      const paused = !run && left > 0 && left < T.dur;
      ctrls.append(btn('リセット', reset, '', 'R'));
      ctrls.append(btn(run ? '一時停止' : paused ? '再開' : '開始', timerToggle, 'main' + (run ? ' pause' : ''), 'Space'));
    }
  }

  else if (S.mode === 'stopwatch') {
    const run = swRun(), el_ = swEl();
    if (run) ctrls.append(btn('ラップ', swLap, '', 'L'), btn('停止', swToggle, 'main pause', 'Space'));
    else if (el_ > 0) ctrls.append(btn('リセット', swReset, '', 'R'), btn('再開', swToggle, 'main', 'Space'));
    else ctrls.append(btn('開始', swToggle, 'main', 'Space'));
    const L = S.sw.laps;
    if (L.length) {
      const splits = L.map((t, i) => t - (L[i - 1] || 0));
      const mx = Math.max(...splits), mn = Math.min(...splits);
      const box = el('<div class="laps"></div>');
      for (let i = L.length - 1; i >= 0; i--) {
        const c = L.length >= 3 ? (splits[i] === mn ? 'best' : splits[i] === mx ? 'worst' : '') : '';
        box.append(el(`<div class="${c}"><span>${i + 1}</span><span>${plain(splits[i])}</span><span>${plain(L[i])}</span></div>`));
      }
      extra.append(box);
    }
  }

  else if (S.mode === 'pomodoro') {
    const P = S.pomo, run = CD.run(P);
    const seg = el('<div class="seg" role="tablist" aria-label="フェーズ"></div>');
    sub.append(seg);
    for (const k of ['work', 'short', 'long']) {
      const c = document.createElement('button');
      c.className = 'chip' + (P.phase === k ? ' on' : ''); c.textContent = PHASE[k];
      c.setAttribute('role', 'tab'); c.setAttribute('aria-selected', P.phase === k);
      c.onclick = act(() => { pomoPhase(k); });
      seg.append(c);
    }
    const started = run || CD.left(P) < P.dur;
    if (started) ctrls.append(btn('リセット', reset, '', 'R'));
    ctrls.append(btn(run ? '一時停止' : started ? '再開' : '開始', pomoToggle, 'main' + (run ? ' pause' : ''), 'Space'));
    ctrls.append(btn('スキップ', pomoSkip, '', '次のフェーズへ'));
    const n = P.phase === 'long' && P.done > 0 ? P.cfg.every : P.done % P.cfg.every;
    const dots = el('<div class="dots"></div>');
    for (let i = 0; i < P.cfg.every; i++) dots.append(el(`<i class="${i < n ? 'f' : ''}"></i>`));
    dots.append(el(`<b>完了 ${P.done}</b>`));
    const row = el('<div style="display:flex;gap:12px;align-items:center"></div>');
    row.append(dots, Object.assign(el('<button class="link">設定</button>'), { onclick: () => { showCfg = !showCfg; ui(); } }));
    extra.append(row);
    if (showCfg) {
      const f = el(`<div class="cfg">
        <label>集中 <input type="number" min="1" max="180" data-k="work">分</label>
        <label>休憩 <input type="number" min="1" max="60" data-k="short">分</label>
        <label>長い休憩 <input type="number" min="1" max="120" data-k="long">分</label>
        <label>長い休憩まで <input type="number" min="1" max="12" data-k="every">回</label>
        <label><input type="checkbox" data-k="auto"> 自動で次へ</label></div>`);
      f.querySelectorAll('input').forEach(i => {
        const k = i.dataset.k;
        if (i.type === 'checkbox') i.checked = P.cfg.auto; else i.value = P.cfg[k];
        i.onchange = () => {
          if (i.type === 'checkbox') P.cfg.auto = i.checked;
          else { const v = Math.round(+i.value); if (v >= 1) P.cfg[k] = v; else i.value = P.cfg[k]; }
          if (!CD.run(P) && CD.left(P) === P.dur) pomoPhase(P.phase);
          save(); tick(true);
        };
      });
      extra.append(f);
    }
  }

  else if (S.mode === 'clock') {
    const b = el(`<button class="link">${S.clock.h24 ? '12時間表示にする' : '24時間表示にする'}</button>`);
    b.onclick = act(() => S.clock.h24 = !S.clock.h24);
    extra.append(b);
  }
  wake();
  tick(true);
}

let lastHTML = '', lastTitle = '', lastSub = '';
function tick(force) {
  // completion checks (run regardless of the visible mode)
  if (CD.run(S.timer) && CD.left(S.timer) <= 0) {
    S.timer.end = null; S.timer.rem = 0;
    return ring('timer', '時間です');
  }
  if (CD.run(S.pomo) && CD.left(S.pomo) <= 0) {
    const was = S.pomo.phase;
    pomoNext();
    if (S.pomo.cfg.auto) CD.start(S.pomo);
    return ring('pomodoro', was === 'work' ? 'おつかれさま。休憩しましょう' : '休憩おわり。集中しましょう');
  }

  let html = '', long = false, prog = null, title = 'Bestimer', segs = null;
  const m = S.mode;
  if (m === 'timer') {
    if (edit != null && !ringing) {
      const d = edit.padStart(6, '0'), n = edit.length;
      for (let i = 0; i < 6; i++) {
        html += `<span class="${i >= 6 - n ? '' : 'dim'}">${d[i]}</span>`;
        if (i % 2) html += `<u>${'hms'[i >> 1]}</u>`;
        if (i === 5) html += '<span class="caret"></span>';
      }
      long = true;
    } else {
      // timer always shows h:mm:ss so the hour can be scrolled from the start
      const t = Math.ceil(CD.left(S.timer) / 1000);
      const parts = [String(Math.floor(t / 3600)), pad(Math.floor(t % 3600 / 60)), pad(t % 60)];
      html = parts.join(':'); long = true;
      if (!CD.run(S.timer) && !ringing) segs = parts;
      prog =S.timer.total ? CD.left(S.timer) / S.timer.total : 0;
    }
  } else if (m === 'stopwatch') {
    const t = swEl(), f = hms(t, false);
    html = `${f.text}<small>.${pad(Math.floor(t % 1000 / 10))}</small>`; long = f.h > 0;
  } else if (m === 'pomodoro') {
    const f = hms(CD.left(S.pomo), true);
    html = f.text; long = f.h > 0;
    prog = S.pomo.total ? CD.left(S.pomo) / S.pomo.total : 0;
  } else {
    const d = new Date();
    let h = d.getHours(), ampm = '';
    if (!S.clock.h24) { ampm = h < 12 ? '午前' : '午後'; h = h % 12 || 12; }
    html = `${S.clock.h24 ? pad(h) : h}:${pad(d.getMinutes())}<small>:${pad(d.getSeconds())}</small>`;
    const s = (ampm ? ampm + '　' : '') + d.toLocaleDateString('ja-JP', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    if (s !== lastSub || force) { sub.textContent = s; lastSub = s; }
  }
  if (segs) renderSegs(segs);
  else if (html !== lastHTML || force) { disp.innerHTML = html; lastHTML = html; }
  // one display size for every mode (timer h:mm:ss sets the width budget)
  bar.classList.toggle('show', prog != null && edit == null);
  if (prog != null) barIn.style.width = (Math.max(0, Math.min(1, prog)) * 100).toFixed(2) + '%';

  // tab title: show whatever is running
  if (ringing) title = '⏰ ' + ringing.msg;
  else if (CD.run(S.timer)) title = hms(CD.left(S.timer), true).text + ' · タイマー';
  else if (CD.run(S.pomo)) title = hms(CD.left(S.pomo), true).text + ' · ' + PHASE[S.pomo.phase];
  else if (swRun()) title = hms(swEl(), false).text + ' · ストップウォッチ';
  else if (m === 'clock') title = html.replace(/<[^>]+>/g, '');
  if (title !== lastTitle) { document.title = title; lastTitle = title; }
  pipRender();
}

/* ---------- picture-in-picture ---------- */
// Chrome/Edge: Document PiP (real buttons in an always-on-top window).
// Others (Safari etc.): video PiP fed from a canvas; play/pause maps to start/stop.
let pipWin = null, pipEls = null, pipVideo = null, pipCanvas = null, pipLast = '';
const MODE_LABEL = { timer: 'タイマー', stopwatch: 'ストップウォッチ', clock: '' };

function pipState() {
  if (ringing) return { sub: ringing.msg, main: '停止', reset: false };
  const m = S.mode;
  if (m === 'timer') {
    const run = CD.run(S.timer), paused = !run && CD.left(S.timer) > 0 && CD.left(S.timer) < S.timer.dur;
    return { sub: MODE_LABEL.timer, main: run ? '一時停止' : paused ? '再開' : '開始', pause: run, reset: true };
  }
  if (m === 'stopwatch') {
    const run = swRun();
    return { sub: MODE_LABEL.stopwatch, main: run ? '停止' : swEl() > 0 ? '再開' : '開始', pause: run, reset: true };
  }
  if (m === 'pomodoro') {
    const run = CD.run(S.pomo), started = run || CD.left(S.pomo) < S.pomo.dur;
    return { sub: PHASE[S.pomo.phase], main: run ? '一時停止' : started ? '再開' : '開始', pause: run, reset: true };
  }
  return { sub: '', main: null, reset: false };
}
const pipMain = () => ringing ? dismiss() : primary();

// PiP layout: everything scales with the window, and parts drop away as it shrinks
// (extras → header/labels → buttons) so the digits always stay readable.
const PIP_CSS = `
body.pip{height:100vh;min-height:0;overflow:hidden}
body.pip header{flex-direction:row;flex-wrap:nowrap;gap:6px;padding:clamp(4px,2vh,10px) 8px 0}

body.pip #fs{display:none!important}
body.pip .icon{width:30px;height:30px}
body.pip .tabs{padding:3px}

body.pip .tabs button i{top:3px;right:3px}
body.pip main{padding:4px 10px 10px;gap:clamp(6px,2.4vh,16px);min-height:0}
body.pip .sub{min-height:0}
body.pip .disp{font-size:min(19vw,24vh)}

@media (max-height:250px){ body.pip header,body.pip .sub,body.pip .bar{display:none} body.pip .disp{font-size:min(20vw,44vh)} }

async function openPip() {
  if (pipWin || pipVideo) return closePip();
  if ('documentPictureInPicture' in window) {
    // Move the real app (header + main + input) into the PiP window, so every
    // control works there exactly as on the page; move it back when it closes.
    try {
      pipWin = await documentPictureInPicture.requestWindow({ width: 440, height: 460 });
    } catch { pipWin = null; return; }
    const d = pipWin.document;
    d.head.innerHTML = '<meta charset="utf-8"><title>Bestimer</title>';
    document.querySelectorAll('link[rel="stylesheet"], style').forEach(n => d.head.append(n.cloneNode(true)));
    d.head.append(Object.assign(d.createElement('style'), { textContent: PIP_CSS }));
    d.body.className = document.body.className;
    d.body.classList.add('pip');
    applyTheme();
    document.body.insertBefore(pipHolder, appParts[0]);
    d.body.append(...appParts);
    d.addEventListener('keydown', onKey);
    d.addEventListener('click', onRingClick, true);
    pipWin.setInterval(() => tick(false), 50);   // the PiP window stays visible, so it keeps the clock smooth
    pipWin.addEventListener('pagehide', () => {
      pipHolder.before(...appParts);              // bring the UI home
      pipHolder.remove();
      pipWin = null; pipLast = '';
      pipBtn.classList.remove('on');
      ui();
    });
  } else if (document.pictureInPictureEnabled) {
    pipCanvas = document.createElement('canvas'); pipCanvas.width = 640; pipCanvas.height = 360;
    pipVideo = Object.assign(document.createElement('video'), { muted: true, playsInline: true });
    pipVideo.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none';
    document.body.append(pipVideo);
    pipRender(true);
    pipVideo.srcObject = pipCanvas.captureStream(20);
    try { await pipVideo.play(); await pipVideo.requestPictureInPicture(); }
    catch { closePip(); return; }
    if ('mediaSession' in navigator) {
      navigator.mediaSession.setActionHandler('play', () => { pipMain(); pipVideo?.play(); });
      navigator.mediaSession.setActionHandler('pause', () => { pipMain(); pipVideo?.play(); });
    }
    pipVideo.addEventListener('leavepictureinpicture', closePip);
  } else return;
  pipBtn.classList.add('on');
  pipRender(true);
}
function closePip() {
  if (pipWin) pipWin.close();
  if (pipVideo) {
    if (document.pictureInPictureElement === pipVideo) document.exitPictureInPicture().catch(() => {});
    pipVideo.srcObject?.getTracks().forEach(t => t.stop());
    pipVideo.remove(); pipVideo = pipCanvas = null;
  }
  pipLast = '';
  pipBtn.classList.remove('on');
}

function pipRender(force) {
  if (pipWin) { if (pipWin.document.title !== document.title) pipWin.document.title = document.title; return; }
  if (!pipVideo) return;
  const st = pipState(), html = lastHTML === '#segs' ? disp.textContent : disp.innerHTML;
  const key = html + '|' + st.sub + '|' + st.main + '|' + document.documentElement.dataset.theme + document.body.className;
  if (key === pipLast && !force) return;
  pipLast = key;
  {
    const c = pipCanvas.getContext('2d'), cs = getComputedStyle(document.body);
    const text = html.replace(/<[^>]+>/g, '');
    c.fillStyle = cs.backgroundColor; c.fillRect(0, 0, 640, 360);
    c.fillStyle = document.body.classList.contains('ringing') ? cs.getPropertyValue('--accent') : cs.color;
    c.textAlign = 'center'; c.textBaseline = 'middle';
    let size = 170; c.font = `700 ${size}px Manrope, Inter, sans-serif`;
    while (c.measureText(text).width > 580 && size > 40) { size -= 6; c.font = `700 ${size}px Manrope, Inter, sans-serif`; }
    c.fillText(text, 320, 196);
    c.fillStyle = cs.getPropertyValue('--sub'); c.font = '500 26px Inter, sans-serif';
    c.fillText(st.sub, 320, 64);
  }
}

// Adjustable timer digits: keep the same span elements and only swap their text,
// so scrolling never rebuilds the DOM (which caused hover/colour flicker).
let hoverU = null;
function renderSegs(vals) {
  const units = vals.length === 3 ? [3600, 60, 1] : [60, 1];
  let spans = disp.querySelectorAll('[data-u]');
  if (spans.length !== units.length || lastHTML !== '#segs') {
    disp.innerHTML = units.map(u => `<span data-u="${u}"></span>`).join(':');
    spans = disp.querySelectorAll('[data-u]');
    lastHTML = '#segs';
  }
  const on = dragU ?? hoverU;
  spans.forEach((s, i) => {
    if (s.textContent !== vals[i]) s.textContent = vals[i];
    s.classList.toggle('on', units[i] === on);
  });
}

/* ---------- events ---------- */
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => setMode(b.dataset.mode));
/* scroll / drag on a digit group to adjust the timer */
const MAXS = 99 * 3600 + 59 * 60 + 59;
const canAdjust = () => S.mode === 'timer' && !CD.run(S.timer) && !ringing && edit == null;
const unitAt = t => +(t.closest?.('[data-u]')?.dataset.u || 60);
function bump(u, dir) {
  const cur = Math.ceil(CD.left(S.timer) / 1000);
  const next = Math.max(0, Math.min(MAXS, cur + dir * u));
  const wasPaused = CD.left(S.timer) !== S.timer.dur;
  CD.set(S.timer, next * 1000);
  save();
  if (wasPaused) ui(); else tick(false);   // buttons only change when leaving the paused state
}
disp.addEventListener('pointermove', e => {
  const u = e.target.closest?.('[data-u]') ? unitAt(e.target) : null;
  if (u !== hoverU) { hoverU = u; if (canAdjust()) tick(false); }
});
disp.addEventListener('pointerleave', () => { hoverU = null; if (canAdjust()) tick(false); });
let wheelAcc = 0;
disp.addEventListener('wheel', e => {
  if (!canAdjust()) return;
  e.preventDefault();
  const u = unitAt(e.target);
  let d = e.deltaMode ? e.deltaY * 40 : e.deltaY;
  if (Math.abs(d) >= 50) return bump(u, d < 0 ? 1 : -1);   // mouse wheel notch = 1 step
  wheelAcc += d;                                            // trackpad: accumulate
  while (Math.abs(wheelAcc) >= 30) { bump(u, wheelAcc < 0 ? 1 : -1); wheelAcc -= Math.sign(wheelAcc) * 30; }
}, { passive: false });

let dragU = null, dragY = 0, dragSteps = 0, dragged = false;
disp.addEventListener('pointerdown', e => {
  if (!canAdjust() || e.button > 0) return;
  dragU = unitAt(e.target); dragY = e.clientY; dragSteps = 0; dragged = false;
  disp.setPointerCapture(e.pointerId);
});
disp.addEventListener('pointermove', e => {
  if (dragU == null) return;
  const dy = dragY - e.clientY;
  if (Math.abs(dy) > 6) dragged = true;
  const steps = Math.trunc(dy / 24);
  while (dragSteps !== steps) { const s = steps > dragSteps ? 1 : -1; dragSteps += s; bump(dragU, s); }
});
const endDrag = () => { if (dragU != null) { dragU = null; tick(true); } };
disp.addEventListener('pointerup', endDrag);
disp.addEventListener('pointercancel', endDrag);

disp.addEventListener('click', () => {
  if (dragged) { dragged = false; return; }
  if (S.mode === 'timer') startEdit();
  else if (S.mode === 'clock') act(() => S.clock.h24 = !S.clock.h24)();
});
kb.addEventListener('input', () => {
  edit = kb.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 6);
  kb.value = edit; ui();
});
kb.addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); commit(); }
  else if (e.key === 'Escape') { e.preventDefault(); cancelEdit(); }
});
kb.addEventListener('blur', () => { setTimeout(() => { if (edit === '' && kb.ownerDocument.activeElement !== kb) cancelEdit(); }, 150); });

// any click while ringing just silences
function onRingClick(e) { if (ringing) { e.stopPropagation(); e.preventDefault(); dismiss(); } }
document.addEventListener('click', onRingClick, true);

document.addEventListener('keydown', onKey);
function onKey(e) {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches('input')) return;
  if (ringing) { e.preventDefault(); return dismiss(); }
  const k = e.key;
  if (k === 'ArrowRight' || k === 'ArrowLeft') {
    const i = MODES.indexOf(S.mode) + (k === 'ArrowRight' ? 1 : -1);
    return setMode(MODES[(i + MODES.length) % MODES.length]);
  }
  if (k === 'f' || k === 'F') return toggleFs();
  if (k === 'p' || k === 'P') return openPip();
  if (k === 'v' || k === 'V') return toggleVoice();
  if (k === 'Escape' && !voice.hidden) return vClose();
  if (S.mode === 'timer') {
    if (/^\d$/.test(k) && !CD.run(S.timer)) { e.preventDefault(); return typeDigit(k); }
    if (edit != null) {
      if (k === 'Backspace') { edit = edit.slice(0, -1); kb.value = edit; return ui(); }
      if (k === 'Escape') return cancelEdit();
      if (k === 'Enter' || k === ' ') { e.preventDefault(); return commit(); }
    }
    if (k === 'ArrowUp' || k === 'ArrowDown') {
      e.preventDefault();
      return act(() => {
        const d = k === 'ArrowUp' ? MIN : -MIN;
        if (CD.run(S.timer) || CD.left(S.timer) < S.timer.dur) CD.add(S.timer, d);
        else CD.set(S.timer, Math.max(MIN, S.timer.dur + d));
      })();
    }
  }
  if (k === ' ' || k === 'Enter') { if (e.target.tagName === 'BUTTON' && k === 'Enter') return; e.preventDefault(); return primary(); }
  if (k === 'r' || k === 'R') return reset();
  if ((k === 'l' || k === 'L') && S.mode === 'stopwatch') return swLap();
}

/* ---------- voice assistant ---------- */
/* voice-parser:start */
function parseVoice(raw) {
  const t = raw.normalize('NFKC').replace(/[\s、。,!?]/g, '').replace(/一時停止/g, 'ポーズ');
  const N = '([0-9]+|[〇零一二三四五六七八九十百千]+)';
  const D = { 〇: 0, 零: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6, 七: 7, 八: 8, 九: 9 };
  const num = s => {
    if (/^\d+$/.test(s)) return +s;
    if (!/[十百千]/.test(s)) return +[...s].map(c => D[c]).join('');
    let total = 0, cur = 0;
    for (const c of s) {
      const u = { 十: 10, 百: 100, 千: 1000 }[c];
      if (u) { total += (cur || 1) * u; cur = 0; } else cur = cur * 10 + D[c];
    }
    return total + cur;
  };

  if (/何時(?!間)|なんじ/.test(t)) return { type: 'time' };
  if (/何日|何曜|日付/.test(t)) return { type: 'date' };
  if (new RegExp(N + '時(?!間)').test(t)) return { type: 'clockTime' };

  let sec = null, m;
  if ((m = t.match(new RegExp(N + '時間(半)?')))) sec = num(m[1]) * 3600 + (m[2] ? 1800 : 0);
  if ((m = t.match(new RegExp(N + '分間?(半)?')))) sec = (sec || 0) + num(m[1]) * 60 + (m[2] ? 30 : 0);
  if ((m = t.match(new RegExp(N + '秒')))) sec = (sec || 0) + num(m[1]);
  if (sec != null) {
    if (/追加|足して|たして|延長|増やして|プラス/.test(t)) return { type: 'add', sec };
    if (/減らして|引いて|ひいて|マイナス|短く/.test(t)) return { type: 'add', sec: -sec };
    return { type: 'set', sec, start: !/セット|設定|合わせ/.test(t) || /開始|スタート|始め/.test(t) };
  }
  if (/残り|あと(何|なん|どれ|どの)|何分|何秒|何時間/.test(t)) return { type: 'remain' };
  if (/ダークモード|暗く/.test(t)) return { type: 'theme', theme: 'dark' };
  if (/ライトモード|明るく/.test(t)) return { type: 'theme', theme: 'light' };

  const mode = /ストップウ[ォオ]ッチ/.test(t) ? 'stopwatch' : /ポモドーロ/.test(t) ? 'pomodoro'
    : /時計|とけい/.test(t) ? 'clock' : /タイマー/.test(t) ? 'timer' : null;
  const rest = t.replace(/ストップウ[ォオ]ッチ/g, '');
  const startWord = /スタート|開始|始め|はじめ|再開|動かして|測って|計って|はかって/.test(rest);

  const phase = /長い休憩|長休憩/.test(rest) ? 'long' : /休憩/.test(rest) ? 'short' : /集中/.test(rest) ? 'work' : null;
  if (phase) return { type: 'phase', phase, start: startWord };
  if (/リセット|クリア|やり直/.test(rest)) return { type: 'reset', mode };
  if (/ラップ/.test(rest)) return { type: 'lap' };
  if (/スキップ|次へ|次に/.test(rest)) return { type: 'skip' };
  if (/ストップ|止め|とめて|停止|ポーズ|待って|まって/.test(rest)) return { type: 'pause', mode };
  if (startWord) return { type: 'start', mode };
  if (mode) return { type: 'mode', mode };
  return null;
}
/* voice-parser:end */

const VOICE_LABEL = { timer: 'タイマー', stopwatch: 'ストップウォッチ', pomodoro: 'ポモドーロ', clock: '時計' };
const isRun = m => m === 'timer' ? CD.run(S.timer) : m === 'stopwatch' ? swRun() : m === 'pomodoro' ? CD.run(S.pomo) : false;
const activeMode = () => isRun(S.mode) ? S.mode : MODES.find(isRun) || S.mode;
function spoken(sec) {
  const h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), s = sec % 60;
  return (h ? h + '時間' : '') + (m ? m + '分' : '') + (s || !(h || m) ? s + '秒' : '');
}
function setRunning(m, on) {
  if (m === 'timer') on ? CD.start(S.timer) : CD.pause(S.timer);
  else if (m === 'pomodoro') on ? CD.start(S.pomo) : CD.pause(S.pomo);
  else if (m === 'stopwatch') {
    if (on && !swRun()) S.sw.start = now();
    if (!on && swRun()) { S.sw.acc = swEl(); S.sw.start = null; }
  }
}
function runVoice(c) {
  if (edit != null) { edit = null; kb.blur(); }
  const d = new Date();
  switch (c.type) {
    case 'time': return `${d.getHours()}時${d.getMinutes()}分です`;
    case 'date': return d.toLocaleDateString('ja-JP', { month: 'long', day: 'numeric', weekday: 'long' }) + 'です';
    case 'clockTime': return '時刻の指定にはまだ対応していません。「30分」のように言ってください';
    case 'set': {
      const sec = Math.min(MAXS, c.sec);
      if (sec <= 0) return '1秒以上の時間を言ってください';
      S.mode = 'timer'; CD.set(S.timer, sec * 1000);
      if (c.start) CD.start(S.timer);
      return `${spoken(sec)}のタイマーを${c.start ? '開始しました' : 'セットしました'}`;
    }
    case 'add': {
      const o = S.mode === 'pomodoro' ? S.pomo : S.timer;
      if (o === S.timer && !CD.run(o) && CD.left(o) === o.dur) {
        CD.set(o, Math.max(0, Math.min(MAXS * 1000, o.dur + c.sec * 1000)));
      } else CD.add(o, c.sec * 1000);
      if (o === S.timer) S.mode = 'timer';
      return `${spoken(Math.abs(c.sec))}${c.sec > 0 ? '増やしました' : '減らしました'}。残り${spoken(Math.ceil(CD.left(o) / 1000))}です`;
    }
    case 'remain': {
      const m = activeMode();
      if (m === 'timer' || m === 'pomodoro') return `残り${spoken(Math.ceil(CD.left(m === 'timer' ? S.timer : S.pomo) / 1000))}です`;
      if (m === 'stopwatch') return `${spoken(Math.floor(swEl() / 1000))}経過しています`;
      return '動いているタイマーはありません';
    }
    case 'theme': S.theme = c.theme; applyTheme(); return c.theme === 'dark' ? 'ダークモードにしました' : 'ライトモードにしました';
    case 'phase':
      S.mode = 'pomodoro'; pomoPhase(c.phase);
      if (c.start) CD.start(S.pomo);
      return `${PHASE[c.phase]}${c.start ? 'を開始しました' : 'に切り替えました'}`;
    case 'reset': {
      const m = c.mode || activeMode();
      if (m === 'clock') return 'リセットするものはありません';
      S.mode = m;
      if (m === 'timer') CD.reset(S.timer);
      else if (m === 'stopwatch') S.sw = { start: null, acc: 0, laps: [] };
      else CD.reset(S.pomo);
      return `${VOICE_LABEL[m]}をリセットしました`;
    }
    case 'lap':
      if (!swRun()) return 'ストップウォッチは動いていません';
      S.mode = 'stopwatch'; S.sw.laps.push(swEl());
      return `ラップ${S.sw.laps.length}を記録しました`;
    case 'skip': {
      const on = CD.run(S.pomo);
      S.mode = 'pomodoro'; pomoNext();
      if (on) CD.start(S.pomo);
      return `${PHASE[S.pomo.phase]}に進みました`;
    }
    case 'pause': {
      const m = c.mode && isRun(c.mode) ? c.mode : activeMode();
      if (!isRun(m)) return '動いているものはありません';
      S.mode = m; setRunning(m, false);
      return `${VOICE_LABEL[m]}を止めました`;
    }
    case 'start': {
      const m = c.mode && c.mode !== 'clock' ? c.mode : S.mode === 'clock' ? 'timer' : S.mode;
      S.mode = m;
      if (isRun(m)) return `${VOICE_LABEL[m]}はもう動いています`;
      if (m === 'timer' && S.timer.dur <= 0) return '時間を言ってください。例えば「5分」';
      setRunning(m, true);
      return `${VOICE_LABEL[m]}を開始しました`;
    }
    case 'mode': S.mode = c.mode; return `${VOICE_LABEL[c.mode]}にしました`;
  }
}

const voice = $('#voice'), vText = $('#vtext'), vHint = $('#vhint'), micBtn = $('#mic');
const VOICE_ERR = {
  'not-allowed': 'マイクの使用が許可されていません',
  'service-not-allowed': '音声認識を使えません。ブラウザの設定を確認してください',
  'audio-capture': 'マイクが見つかりません',
  network: '音声認識サービスに接続できません',
};
let rec = null, vHideTimer = 0;
const getSR = () => window.SpeechRecognition || window.webkitSpeechRecognition;
function vShow(state, text, hint = '') {
  clearTimeout(vHideTimer);
  voice.hidden = false; voice.dataset.state = state;
  vText.textContent = text; vHint.textContent = hint;
  micBtn.classList.toggle('on', state === 'listen');
}
function vClose() {
  clearTimeout(vHideTimer);
  const r = rec; rec = null;
  if (r) try { r.abort(); } catch {}
  window.speechSynthesis?.cancel();
  voice.hidden = true; micBtn.classList.remove('on');
}
function vReply(text, hint = '') {
  vShow('reply', text, hint);
  const synth = window.speechSynthesis;
  if (synth && window.SpeechSynthesisUtterance) {
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP'; u.rate = 1.05;
    synth.speak(u);
  }
  vHideTimer = setTimeout(vClose, Math.max(3000, text.length * 190 + 1600));
}
function vHandle(alts) {
  let cmd = null;
  for (const a of alts) if ((cmd = parseVoice(a))) break;
  if (!cmd) return vReply('もう一度お願いします', `「${alts[0]}」 例:5分、止めて、残りは?`);
  const reply = runVoice(cmd);
  save(); ui();
  vReply(reply, `「${alts[0]}」`);
}
function startVoice() {
  const SR = getSR();
  if (!SR) return;
  clearTimeout(vHideTimer);
  window.speechSynthesis?.cancel();
  audio();
  const r = rec = new SR();
  r.lang = 'ja-JP'; r.interimResults = true; r.maxAlternatives = 3; r.continuous = false;
  let alts = [], err = null;
  const finish = () => {
    if (rec !== r) return;
    rec = null;
    if (alts.length) vHandle(alts);
    else vReply(VOICE_ERR[err] || '聞き取れませんでした');
  };
  r.onresult = e => {
    if (rec !== r) return;
    const res = e.results[e.results.length - 1];
    alts = [...res].map(a => a.transcript.trim()).filter(Boolean);
    if (alts[0]) vShow('listen', alts[0]);
    if (res.isFinal && alts.length) { finish(); try { r.stop(); } catch {} }
  };
  r.onerror = e => { err = e.error; };
  r.onend = finish;
  // Chrome and others process speech on a remote service: say so once, before the first use
  const hint = S.voiceSeen ? '例:5分、止めて、残りは?' : '音声はブラウザの音声認識サービスに送られます';
  if (!S.voiceSeen) { S.voiceSeen = true; save(); }
  vShow('listen', '聞いています…', hint);
  try { r.start(); } catch { rec = null; vReply('音声認識を開始できませんでした'); }
}
function toggleVoice() {
  if (!getSR()) return;
  if (rec) vClose(); else startVoice();
}
micBtn.onclick = toggleVoice;
voice.onclick = vClose;
if (!getSR()) micBtn.style.display = 'none';

function toggleFs() {
  if (pipWin) return;
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(() => {});
}
$('#fs').onclick = toggleFs;
$('#pip').onclick = openPip;
if (!('documentPictureInPicture' in window) && !document.pictureInPictureEnabled) $('#pip').style.display = 'none';
if (!document.documentElement.requestFullscreen) $('#fs').style.display = 'none';

function applyTheme() {
  for (const r of [document.documentElement, pipWin?.document.documentElement]) {
    if (!r) continue;
    if (S.theme) r.dataset.theme = S.theme; else delete r.dataset.theme;
  }
}
$('#theme').onclick = () => {
  const dark = S.theme ? S.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  S.theme = dark ? 'light' : 'dark'; applyTheme(); save();
};
applyTheme();

document.addEventListener('visibilitychange', () => { wake(); tick(true); });

// restore: a timer that ended while the page was closed
ui();
setInterval(() => tick(false), 50);
})();
</script>
</body>
</html>
